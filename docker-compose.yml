version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fintelligence_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fintelligence
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintelligence_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:rootpassword@mysql:3306/fintelligence
      JWT_SECRET_KEY: fintelligence_jwt_super_secret_key_2026_prod
      SECRET_KEY: fintelligence_flask_session_secret_key_2026
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3:8b
      ENVIRONMENT: production
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintelligence_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
